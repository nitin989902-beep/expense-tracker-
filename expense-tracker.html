<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Smart Expense Tracker</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--tx:#1b1f2a;--mu:#6b7385;--bd:#e3e6ee;--ac:#4f46e5;--ac2:#eef0ff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12141b;--card:#1b1e28;--tx:#eceef5;--mu:#98a0b3;--bd:#2c3040;--ac:#818cf8;--ac2:#25284a}}
:root[data-theme="dark"]{--bg:#12141b;--card:#1b1e28;--tx:#eceef5;--mu:#98a0b3;--bd:#2c3040;--ac:#818cf8;--ac2:#25284a}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:900px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:22px;margin:0 0 2px}p.s{color:var(--mu);margin:0 0 16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:14px}
textarea{width:100%;height:110px;border:1px solid var(--bd);border-radius:10px;padding:10px;background:var(--bg);color:var(--tx);font:13px/1.4 ui-monospace,Menlo,monospace;resize:vertical}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
button,.fl{border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:8px 12px;border-radius:9px;font:inherit;cursor:pointer}
button.p{background:var(--ac);border-color:var(--ac);color:#fff}
.fl input{display:none}
.m{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.m div{background:var(--ac2);border-radius:12px;padding:12px}.m b{display:block;font-size:20px}.m span{color:var(--mu);font-size:13px}
.g{display:flex;flex-wrap:wrap;gap:20px;align-items:center}
.donut{width:170px;height:170px;border-radius:50%;flex:none;position:relative}
.donut::after{content:"";position:absolute;inset:36px;background:var(--card);border-radius:50%}
.leg{flex:1;min-width:220px}.lr{display:flex;align-items:center;gap:8px;margin:5px 0;font-size:14px}
.dot{width:10px;height:10px;border-radius:50%;flex:none}.bar{flex:1;height:6px;background:var(--bd);border-radius:4px;overflow:hidden}.bar i{display:block;height:100%}
.lr em{font-style:normal;color:var(--mu);min-width:84px;text-align:right}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px;min-width:560px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--bd)}th{color:var(--mu);font-weight:500}
td.a{text-align:right;white-space:nowrap}.cr{color:#16a34a}select{background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:7px;padding:4px}
#err{color:#dc2626;margin-top:8px}.hid{display:none}
</style></head>
<body><main>
<h1>💸 Smart Expense Tracker</h1>
<p class="s">Paste bank SMS or upload a statement CSV. Spending is sorted into categories automatically.</p>

<div class="card">
<textarea id="sms" placeholder="Paste bank SMS here, one per line…"></textarea>
<div class="row">
<button class="p" id="bSms">Analyze SMS</button>
<label class="fl">Upload CSV<input type="file" id="f" accept=".csv"></label>
<button id="sS">Load sample SMS</button><button id="sC">Load sample CSV</button><button id="clr">Clear</button>
</div><div id="err"></div></div>

<div id="res" class="hid">
<div class="card"><div class="m" id="m"></div></div>
<div class="card"><div class="g"><div class="donut" id="dn"></div><div class="leg" id="lg"></div></div></div>
<div class="card"><b>Transactions</b><p class="s">Change a category and the app remembers it for that merchant next time.</p>
<div class="tw"><table><thead><tr><th>Date</th><th>Description</th><th>Category</th><th style="text-align:right">Amount</th></tr></thead><tbody id="tb"></tbody></table></div></div>
</div>
</main>
<script>
const CATS={"Food & Dining":["swiggy","zomato","dominos","mcdonald","kfc","cafe","restaurant","canteen","pizza","starbucks","bakery","chai","burger"],
"Groceries":["bigbasket","blinkit","zepto","grofers","dmart","grocery","kirana","instamart","vegetables","milk"],
"Transport":["uber","ola","rapido","irctc","metro","redbus","petrol","fuel","indian oil","hpcl","fastag","cab","auto fare"],
"Shopping":["amazon","flipkart","myntra","ajio","meesho","nykaa","decathlon"],
"Bills & Recharge":["airtel","jio"," vi ","bsnl","electricity","broadband","recharge","dth","wifi","water bill"],
"Entertainment":["netflix","hotstar","spotify","bookmyshow","prime video","youtube","pvr","inox"],
"Education":["udemy","coursera","college","tuition","fees","exam","books","unacademy","stationery"],
"Health":["pharmacy","apollo","medplus","hospital","clinic","pharmeasy","medicine","doctor"],
"Rent & Housing":["rent","hostel","mess","maintenance"," pg "],
"Transfers":["neft","imps","self transfer","atm cash"]};
const COL=["#6366f1","#f59e0b","#10b981","#ef4444","#06b6d4","#ec4899","#8b5cf6","#84cc16","#f97316","#14b8a6","#94a3b8"];
const ALL=Object.keys(CATS).concat("Others");
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const inr=n=>"₹"+Math.round(n).toLocaleString("en-IN");
let rows=[],corr={};
try{corr=JSON.parse(localStorage.getItem("corr")||"{}")}catch(e){}
const saveCorr=()=>{try{localStorage.setItem("corr",JSON.stringify(corr))}catch(e){}};
const key=s=>s.toLowerCase().replace(/[^a-z ]/g," ").replace(/\s+/g," ").trim();
function cat(d){const k=key(d);if(corr[k])return corr[k];const t=" "+k+" ";for(const c in CATS)if(CATS[c].some(w=>t.includes(w)))return c;return "Others"}
const MON="jan feb mar apr may jun jul aug sep oct nov dec".split(" ");
function pd(s){let m=s.match(/(\d{1,2})[-\/]([A-Za-z]{3})[a-z]*[-\/](\d{2,4})/),d,mo,y;
if(m){d=+m[1];mo=MON.indexOf(m[2].toLowerCase());y=+m[3]}else{m=s.match(/(\d{1,2})[-\/](\d{1,2})[-\/](\d{2,4})/);if(!m)return null;d=+m[1];mo=+m[2]-1;y=+m[3]}
if(mo<0)return null;if(y<100)y+=2000;return new Date(y,mo,d)}
const fd=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
function parseSMS(t){const out=[];t.split("\n").forEach(l=>{l=l.trim();
const m=l.match(/(?:rs\.?|inr|₹)\s*([\d,]+(?:\.\d{1,2})?)/i);if(!m)return;
const type=/credited|received|deposited|refund/i.test(l)?"credit":/debited|spent|paid|sent|purchase|withdrawn|txn of/i.test(l)?"debit":null;if(!type)return;
const mm=l.match(/(?:\bat|\bto|towards|vpa|info:?)\s+([A-Za-z0-9@&._ \-]{3,40}?)(?=\s+on\b|\s+ref\b|\s+avl\b|\.\s|\.$|,|$)/i);
out.push({date:pd(l)||new Date(),desc:mm?mm[1].trim():l.slice(0,40),amt:parseFloat(m[1].replace(/,/g,"")),type})});return out}
function splitLine(l){const r=[];let c="",q=false;for(const ch of l){if(ch=='"')q=!q;else if(ch==","&&!q){r.push(c);c=""}else c+=ch}r.push(c);return r.map(s=>s.trim())}
function parseCSV(t){const L=t.split(/\r?\n/).filter(x=>x.trim());if(L.length<2)throw Error("The CSV looks empty.");
const h=splitLine(L[0]).map(s=>s.toLowerCase()),f=ks=>h.findIndex(x=>ks.some(k=>x.includes(k)));
const cd=f(["date"]),cs=f(["narration","description","particular","remark","details"]),cw=f(["debit","withdrawal"]),cr=f(["credit","deposit"]),ca=f(["amount"]);
if(cd<0||cs<0)throw Error("CSV needs a date column and a description/narration column.");
const n=v=>parseFloat(String(v||"").replace(/,/g,""))||0,out=[];
L.slice(1).forEach(l=>{const c=splitLine(l),d=pd(c[cd]||"");if(!d)return;let amt,type;
if(cw>=0&&cr>=0&&cw!=cr){const w=n(c[cw]);amt=w>0?w:n(c[cr]);type=w>0?"debit":"credit"}
else if(ca>=0){const a=n(c[ca]);amt=Math.abs(a);type=a<0?"debit":"credit"}else return;
out.push({date:d,desc:c[cs],amt,type})});return out}
function load(list){$("err").textContent="";if(!list.length){$("err").textContent="No transactions found in that input.";return}
rows=list.map(r=>({...r,cat:cat(r.desc)}));render()}
function render(){
const sp=rows.filter(r=>r.type=="debit"),tot=sp.reduce((a,r)=>a+r.amt,0),inc=rows.filter(r=>r.type=="credit").reduce((a,r)=>a+r.amt,0);
const by={};sp.forEach(r=>by[r.cat]=(by[r.cat]||0)+r.amt);
const cs=Object.entries(by).sort((a,b)=>b[1]-a[1]),top=cs[0];
$("m").innerHTML=`<div><b>${inr(tot)}</b><span>Total spent</span></div><div><b>${inr(inc)}</b><span>Total received</span></div><div><b>${rows.length}</b><span>Transactions</span></div><div><b>${top?esc(top[0]):"-"}</b><span>Top category</span></div>`;
let a=0,g=[];cs.forEach(([c,v],i)=>{const p=v/tot*100;g.push(COL[i%COL.length]+" "+a+"% "+(a+p)+"%");a+=p});
$("dn").style.background=g.length?"conic-gradient("+g.join(",")+")":"var(--bd)";
$("lg").innerHTML=cs.map(([c,v],i)=>`<div class="lr"><span class="dot" style="background:${COL[i%COL.length]}"></span><span style="min-width:110px">${esc(c)}</span><span class="bar"><i style="width:${v/tot*100}%;background:${COL[i%COL.length]}"></i></span><em>${inr(v)}</em></div>`).join("")||"<span class='s'>No spending found.</span>";
$("tb").innerHTML=rows.map((r,i)=>`<tr><td>${fd(r.date)}</td><td>${esc(r.desc)}</td><td><select data-i="${i}">${ALL.map(c=>`<option${c==r.cat?" selected":""}>${esc(c)}</option>`).join("")}</select></td><td class="a ${r.type=="credit"?"cr":""}">${r.type=="credit"?"+":"-"}${inr(r.amt)}</td></tr>`).join("");
$("res").classList.remove("hid")}
$("tb").addEventListener("change",e=>{const i=e.target.dataset.i;if(i===undefined)return;const k=key(rows[i].desc);corr[k]=e.target.value;saveCorr();rows.forEach(r=>{if(key(r.desc)==k)r.cat=e.target.value});render()});
$("bSms").onclick=()=>load(parseSMS($("sms").value));
$("f").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{load(parseCSV(r.result))}catch(x){$("err").textContent=x.message}};r.readAsText(f)};
const SS="Rs.320.00 debited from A/c XX1234 on 01-Oct-26 to VPA zomato@icici. Ref 4021.\nINR 215.50 spent on Card XX5678 at UBER INDIA on 02-10-2026. Avl bal INR 8000.\nRs 12,000.00 credited to A/c XX1234 on 05-Oct-26 info: STIPEND.\nRs.860.00 paid to BIGBASKET on 06/10/2026 via UPI. Ref 8812.\nYour a/c debited for Rs.299 towards AIRTEL recharge on 08-Oct-26.";
const SC="Date,Narration,Withdrawal Amt,Deposit Amt\n01/10/2026,UPI-SWIGGY-swiggy@icici,320,0\n02/10/2026,UPI-UBER INDIA,215.5,0\n03/10/2026,ATM CASH WITHDRAWAL,2000,0\n04/10/2026,AMAZON PAY INDIA,1499,0\n05/10/2026,SALARY-STIPEND OCT,0,12000\n06/10/2026,UPI-BIGBASKET,860,0\n08/10/2026,AIRTEL PREPAID RECHARGE,299,0\n10/10/2026,NETFLIX.COM,199,0\n12/10/2026,UPI-CHAI POINT,90,0\n14/10/2026,APOLLO PHARMACY,420,0\n15/10/2026,UDEMY COURSE PURCHASE,449,0\n18/10/2026,UPI-HOSTEL MESS CHARGES,3500,0";
$("sS").onclick=()=>{$("sms").value=SS;load(parseSMS(SS))};
$("sC").onclick=()=>load(parseCSV(SC));
$("clr").onclick=()=>{rows=[];$("sms").value="";$("err").textContent="";$("res").classList.add("hid")};
</script></body></html>
